<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Funna — Your Running Coach</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #0a0e18;
    --bg-2: #060912;
    --panel: rgba(20, 27, 44, 0.9);
    --panel-solid: #141b2c;
    --panel-2: rgba(255, 255, 255, 0.04);
    --panel-3: rgba(255, 255, 255, 0.06);
    --border: rgba(255, 255, 255, 0.08);
    --border-strong: rgba(255, 255, 255, 0.14);
    --text: #f0f4fa;
    --text-2: #c1c8d6;
    --muted: #7a8298;
    --muted-2: #5a6378;
    --accent: #ff6b3d;
    --accent-2: #ffb020;
    --accent-glow: rgba(255, 107, 61, 0.18);
    --green: #34d399;
    --blue: #60a5fa;
    --purple: #c084fc;
    --red: #f87171;
    --yellow: #fbbf24;
    --teal: #2dd4bf;
    --pink: #f472b6;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.2);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.25);
    --shadow-lg: 0 12px 32px rgba(0,0,0,0.35);
    --radius: 14px;
    --radius-lg: 18px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    font-feature-settings: "ss01", "cv11";
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    letter-spacing: -0.01em;
  }
  body {
    background:
      radial-gradient(ellipse 1200px 700px at 50% -10%, rgba(255, 107, 61, 0.10), transparent 65%),
      radial-gradient(ellipse 900px 600px at 100% 100%, rgba(168, 85, 247, 0.06), transparent 60%),
      radial-gradient(ellipse 700px 500px at 0% 60%, rgba(45, 212, 191, 0.04), transparent 60%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
    background-attachment: fixed;
    min-height: 100vh;
  }
  a { color: var(--accent); text-decoration: none; }
  button {
    font-family: inherit;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
    border-radius: 10px;
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: -0.01em;
    transition: transform .12s cubic-bezier(.2,.8,.2,1), background .18s ease, border-color .18s ease, box-shadow .18s ease;
  }
  button:hover { border-color: var(--border-strong); background: var(--panel-3); }
  button:active { transform: translateY(1px); }
  button.primary {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border: 1px solid rgba(255, 107, 61, 0.4);
    color: #1a1102;
    font-weight: 600;
    box-shadow: 0 1px 0 rgba(255,255,255,0.2) inset, 0 4px 14px rgba(255, 107, 61, 0.25);
  }
  button.primary:hover {
    filter: brightness(1.06);
    box-shadow: 0 1px 0 rgba(255,255,255,0.25) inset, 0 6px 20px rgba(255, 107, 61, 0.35);
    transform: translateY(-1px);
  }
  button.ghost { background: transparent; }
  button.ghost:hover { background: var(--panel-2); }
  button.danger { background: transparent; color: var(--red); border-color: rgba(248,113,113,0.25); }
  input, select, textarea {
    font-family: inherit;
    background: rgba(0, 0, 0, 0.25);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 14px;
    width: 100%;
    transition: border-color .18s ease, box-shadow .18s ease, background .18s ease;
  }
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--accent);
    background: rgba(0, 0, 0, 0.35);
    box-shadow: 0 0 0 4px var(--accent-glow);
  }
  input::placeholder, textarea::placeholder { color: var(--muted-2); }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 8px; font-weight: 500; letter-spacing: 0.02em; }

  header.topbar {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 28px;
    background: rgba(10, 14, 24, 0.6);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 16px; letter-spacing: -0.02em; }
  .brand .logo {
    width: 32px; height: 32px; border-radius: 9px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: grid; place-items: center; color: #1a1102; font-weight: 900;
    box-shadow: 0 1px 0 rgba(255,255,255,0.2) inset, 0 4px 14px rgba(255, 107, 61, 0.3);
  }
  .topbar .actions { display: flex; gap: 8px; align-items: center; }
  .topbar #user-email { padding: 0 8px; }

  .container { max-width: 1320px; margin: 0 auto; padding: 32px 28px; }
  .grid { display: grid; gap: 16px; }
  .section-title { font-size: 17px; font-weight: 700; margin: 0 0 16px; letter-spacing: -0.02em; }

  /* Onboarding */
  .onboarding-wrap {
    min-height: calc(100vh - 60px);
    display: flex;
    justify-content: center;
    align-items: flex-start;       /* anchor card to top, don't recentre when height changes */
    padding: 64px 20px 40px;
  }
  .card {
    background: linear-gradient(180deg, rgba(22, 30, 48, 0.85), rgba(15, 21, 35, 0.85));
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 24px;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    box-shadow: 0 1px 0 rgba(255,255,255,0.04) inset, var(--shadow-md);
  }
  .onboarding {
    width: 100%; max-width: 640px;
  }
  /* Reserve a minimum body height so the Back/Next row sits in the same place
     across steps and the card outline doesn't visibly shrink/grow. */
  #step-body { min-height: 340px; }
  .steps { display: flex; gap: 6px; margin-bottom: 28px; }
  .step-pill {
    flex: 1; height: 4px; border-radius: 999px; background: rgba(255,255,255,0.08);
    transition: background .3s ease;
  }
  .step-pill.active { background: linear-gradient(90deg, var(--accent), var(--accent-2)); box-shadow: 0 0 12px rgba(255, 107, 61, 0.4); }
  .step-title { font-size: 26px; font-weight: 700; margin: 0 0 8px; letter-spacing: -0.03em; }
  .step-sub { color: var(--muted); margin: 0 0 24px; font-size: 14px; line-height: 1.5; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .row-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    padding: 10px 16px;
    border: 1px solid var(--border);
    border-radius: 999px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    background: var(--panel-2);
    user-select: none;
    color: var(--text-2);
    transition: all .15s ease;
  }
  .chip:hover { border-color: var(--border-strong); color: var(--text); }
  .chip.selected {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(255, 107, 61, 0.10);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }
  .nav-row {
    display: flex; justify-content: space-between; margin-top: 28px;
  }

  /* Dashboard layout */
  .layout {
    display: grid;
    grid-template-columns: 280px 1fr;
    gap: 24px;
  }
  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
  }
  .sidebar {
    position: sticky; top: 76px; align-self: start;
  }
  .side-section { margin-bottom: 24px; }
  .side-section:last-child { margin-bottom: 0; }
  .side-section h4 {
    text-transform: uppercase; font-size: 11px; color: var(--muted); margin: 0 0 14px; letter-spacing: 1.4px; font-weight: 600;
  }
  .nav-btn {
    width: 100%; text-align: left; padding: 11px 14px; background: transparent;
    border: 1px solid transparent; border-radius: 10px; color: var(--text-2);
    display: flex; align-items: center; gap: 12px; font-size: 14px; font-weight: 500;
    transition: all .15s ease;
  }
  .nav-btn:hover { background: var(--panel-2); color: var(--text); }
  .nav-btn.active {
    background: linear-gradient(135deg, rgba(255, 107, 61, 0.10), rgba(255, 107, 61, 0.05));
    border-color: rgba(255, 107, 61, 0.25);
    color: var(--text);
  }
  .nav-btn .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
  .nav-btn.active .dot { background: var(--accent); box-shadow: 0 0 8px var(--accent); }

  /* Metric cards */
  .metrics {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px;
  }
  @media (max-width: 900px) { .metrics { grid-template-columns: repeat(2, 1fr); } }
  .metric {
    background: linear-gradient(180deg, rgba(22, 30, 48, 0.85), rgba(15, 21, 35, 0.85));
    border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px;
    backdrop-filter: blur(8px);
    box-shadow: 0 1px 0 rgba(255,255,255,0.04) inset, var(--shadow-sm);
    transition: transform .18s ease, border-color .18s ease;
  }
  .metric:hover { border-color: var(--border-strong); }
  .metric .label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 1.4px; font-weight: 600; }
  .metric .value { font-size: 26px; font-weight: 700; margin-top: 10px; letter-spacing: -0.03em; line-height: 1.1; }
  .metric .sub { color: var(--muted); font-size: 12px; margin-top: 6px; }
  .progress {
    margin-top: 14px; background: rgba(255,255,255,0.06); border-radius: 999px; height: 5px; overflow: hidden;
  }
  .progress > div {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    box-shadow: 0 0 12px rgba(255, 107, 61, 0.5);
    transition: width .4s cubic-bezier(.2,.8,.2,1);
  }

  /* Calendar */
  .calendar-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 18px; gap: 12px; flex-wrap: wrap;
  }
  .calendar-head h2 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -0.02em; }
  .cal-nav { display: flex; gap: 6px; }
  .cal-nav button { padding: 8px 14px; font-size: 13px; }
  .week-grid {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 12px;
  }
  @media (max-width: 900px) {
    .week-grid { grid-template-columns: 1fr; gap: 10px; }
  }
  .day {
    background: linear-gradient(180deg, rgba(20, 27, 44, 0.6), rgba(15, 21, 35, 0.6));
    border: 1px solid var(--border); border-radius: var(--radius);
    min-height: 170px; padding: 14px;
    display: flex; flex-direction: column;
    transition: border-color .18s ease, transform .18s ease, box-shadow .18s ease;
  }
  .day:hover { border-color: var(--border-strong); }
  .day.today {
    border-color: rgba(255, 107, 61, 0.5);
    background: linear-gradient(180deg, rgba(40, 22, 12, 0.7), rgba(20, 27, 44, 0.5));
    box-shadow: 0 0 0 1px rgba(255,107,61,.25) inset, 0 8px 24px rgba(255, 107, 61, 0.08);
  }
  .day.drag-over {
    background: linear-gradient(180deg, rgba(40, 22, 12, 0.8), rgba(30, 22, 35, 0.7));
    border-color: var(--accent);
    transform: scale(1.01);
  }
  .day-head {
    display: flex; justify-content: space-between; align-items: flex-start;
    gap: 8px; margin-bottom: 14px;
    padding-bottom: 12px; border-bottom: 1px solid var(--border);
  }
  .day-name { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1.4px; font-weight: 600; }
  .day-date { font-size: 22px; font-weight: 700; line-height: 1.1; margin-top: 2px; letter-spacing: -0.02em; }
  .day .badge {
    background: linear-gradient(135deg, rgba(255, 107, 61, 0.2), rgba(255, 176, 32, 0.2));
    color: var(--accent);
    border: 1px solid rgba(255, 107, 61, 0.3);
    padding: 3px 8px; font-size: 9px; font-weight: 700; letter-spacing: 1.2px;
  }
  .run-card {
    background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.02));
    border: 1px solid var(--border);
    border-radius: 11px; padding: 12px 14px 12px 16px;
    margin-bottom: 8px;
    cursor: grab; position: relative;
    border-left: 3px solid var(--muted);
    transition: border-color .18s ease, transform .18s ease, background .18s ease;
  }
  .run-card:hover { transform: translateY(-1px); border-color: var(--border-strong); }
  .run-card:active { cursor: grabbing; }
  .run-card.dragging { opacity: .4; }
  .run-card.completed { opacity: .65; }
  .run-card.completed .run-title { text-decoration: line-through; color: var(--muted); }
  .run-card .run-title {
    font-size: 13px; font-weight: 600; margin-bottom: 4px;
    padding-right: 28px; line-height: 1.3;
    letter-spacing: -0.01em;
  }
  .run-card .run-meta { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .run-card .check {
    position: absolute; top: 12px; right: 12px;
    width: 20px; height: 20px; border-radius: 50%;
    border: 1.5px solid var(--muted); background: transparent;
    display: grid; place-items: center; padding: 0;
    transition: all .15s ease;
  }
  .run-card .check:hover { border-color: var(--text); }
  .run-card .check.checked {
    background: var(--green); border-color: var(--green);
    box-shadow: 0 0 0 3px rgba(52, 211, 153, 0.15);
  }
  .run-card .check.checked::after {
    content: "✓"; color: #052b13; font-size: 12px; font-weight: 900; line-height: 1;
  }

  /* Run types colors (left border) */
  .type-long { border-left-color: var(--blue); }
  .type-tempo { border-left-color: var(--red); }
  .type-intervals { border-left-color: var(--purple); }
  .type-hill { border-left-color: var(--pink); }
  .type-fartlek { border-left-color: var(--yellow); }
  .type-easy { border-left-color: var(--green); }
  .type-recovery { border-left-color: var(--teal); }
  .type-race { border-left-color: var(--accent); }

  .badge {
    display: inline-block; font-size: 10px; padding: 4px 8px;
    border-radius: 6px; background: var(--panel-2); color: var(--muted);
    text-transform: uppercase; letter-spacing: 1px; font-weight: 600;
    border: 1px solid var(--border);
  }
  /* Custom scrollbar */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 999px; border: 2px solid transparent; background-clip: padding-box; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.15); background-clip: padding-box; border: 2px solid transparent; }
  .legend { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; margin-top: 0; }
  .legend-item { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--text-2); }
  .legend-swatch { width: 12px; height: 12px; border-radius: 4px; flex-shrink: 0; box-shadow: 0 0 0 1px rgba(255,255,255,0.08), 0 1px 2px rgba(0,0,0,0.4); }

  /* Modal */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,.65);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    display: grid; place-items: center; z-index: 50;
    animation: fadeIn .2s ease;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    width: 92%; max-width: 540px;
    background: linear-gradient(180deg, rgba(28, 36, 56, 0.95), rgba(20, 27, 44, 0.95));
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-lg); padding: 26px;
    box-shadow: var(--shadow-lg);
    animation: slideUp .25s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .modal h3 { margin: 0 0 6px; font-size: 18px; letter-spacing: -0.02em; }
  .modal p.sub { color: var(--muted); margin: 0 0 18px; font-size: 13px; line-height: 1.5; }
  .modal-actions { display: flex; justify-content: space-between; gap: 8px; margin-top: 20px; align-items: center; }
  .modal-actions-right { display: flex; gap: 8px; }
  .modal-actions button:disabled { opacity: 0.4; cursor: not-allowed; }

  /* Helpers */
  .flex { display: flex; }
  .flex-between { display: flex; align-items: center; justify-content: space-between; }
  .gap-8 { gap: 8px; } .gap-12 { gap: 12px; }
  .muted { color: var(--muted); font-size: 13px; }
  .hidden { display: none !important; }

  /* Auth screen */
  .auth-tabs { display: flex; gap: 8px; margin-bottom: 18px; }
  .auth-tab {
    flex: 1; padding: 10px 14px; border-radius: 10px;
    border: 1px solid var(--border); background: transparent; color: var(--muted);
    font-size: 14px;
  }
  .auth-tab.active {
    background: var(--panel-2); color: var(--text); border-color: var(--accent);
  }
  .auth-card { width: 100%; max-width: 420px; }
  .auth-brand {
    display: flex; align-items: center; gap: 10px; justify-content: center;
    margin-bottom: 18px; font-weight: 700; font-size: 20px;
  }
  .auth-brand .logo {
    width: 36px; height: 36px; border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: grid; place-items: center; color: #1a1102; font-weight: 900; font-size: 18px;
  }
  .full-loader {
    min-height: calc(100vh - 60px);
    display: grid; place-items: center; color: var(--muted);
  }
  .password-wrap { position: relative; }
  .password-wrap input { padding-right: 42px; }
  .password-toggle {
    position: absolute;
    right: 6px; top: 50%; transform: translateY(-50%);
    background: transparent; border: none; padding: 6px;
    color: var(--muted); cursor: pointer;
    display: grid; place-items: center; border-radius: 6px;
    width: auto;
  }
  .password-toggle:hover { color: var(--text); }

  /* Bar chart */
  .bar-chart { display: grid; gap: 10px; }
  .bar-row { display: grid; grid-template-columns: 130px 1fr 70px; gap: 12px; align-items: center; font-size: 12px; color: var(--text-2); }
  .bar-track { background: rgba(255,255,255,0.05); border-radius: 999px; height: 8px; overflow: hidden; }
  .bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    border-radius: 999px;
    transition: width .4s cubic-bezier(.2,.8,.2,1);
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="logo">F</div>
    <div>Funna</div>
    <span class="badge">v1 prototype</span>
  </div>
  <div class="actions">
    <span id="user-email" class="muted hidden" style="font-size:13px;"></span>
    <button id="btn-reset" class="ghost hidden" title="Clear all data and start again">Reset plan</button>
    <button id="btn-logout" class="ghost hidden">Sign out</button>
  </div>
</header>

<!-- BOOT LOADER (visible until we know if you're signed in) -->
<section id="boot-loader" class="full-loader">
  <div>Loading…</div>
</section>

<!-- AUTH SCREEN -->
<section id="auth" class="onboarding-wrap hidden">
  <div class="card auth-card">
    <div class="auth-brand">
      <div class="logo">F</div>
      <div>Funna</div>
    </div>
    <div class="auth-tabs">
      <button class="auth-tab active" data-mode="signin">Sign in</button>
      <button class="auth-tab" data-mode="signup">Create account</button>
    </div>
    <h2 class="step-title" id="auth-title">Welcome back</h2>
    <p class="step-sub" id="auth-sub">Sign in to access your training plan.</p>
    <label>Email</label>
    <input type="email" id="auth-email" autocomplete="email" placeholder="you@example.com" />
    <div style="height:12px;"></div>
    <label>Password</label>
    <div class="password-wrap">
      <input type="password" id="auth-password" autocomplete="current-password" placeholder="At least 6 characters" />
      <button type="button" class="password-toggle" data-target="auth-password" aria-label="Show password"></button>
    </div>
    <div id="auth-password-confirm-row" class="hidden">
      <div style="height:12px;"></div>
      <label>Confirm password</label>
      <div class="password-wrap">
        <input type="password" id="auth-password-confirm" autocomplete="new-password" placeholder="Re-enter password" />
        <button type="button" class="password-toggle" data-target="auth-password-confirm" aria-label="Show password"></button>
      </div>
    </div>
    <p id="auth-error" style="color:var(--red); font-size:13px; margin-top:8px; min-height:16px;"></p>
    <p id="auth-info" style="color:var(--green); font-size:13px; margin-top:0; min-height:16px;"></p>
    <button id="auth-submit" class="primary" style="width:100%; margin-top:8px;">Sign in</button>
    <p style="text-align:center; margin-top:12px;">
      <a href="#" id="auth-forgot" style="font-size:13px; color:var(--muted);">Forgot password?</a>
    </p>
  </div>
</section>

<!-- ONBOARDING -->
<section id="onboarding" class="onboarding-wrap hidden">
  <div class="card onboarding">
    <div class="steps" id="steps"></div>
    <div id="step-body"></div>
    <div class="nav-row">
      <button id="btn-back" class="ghost">Back</button>
      <button id="btn-next" class="primary">Next</button>
    </div>
  </div>
</section>

<!-- APP -->
<main id="app" class="container hidden">

/* ============================================================
   DATE HELPERS — always operate in local timezone
   These guard against the JS timezone bug where toISOString() returns UTC,
   so "midnight local" can become "23:00 UTC the day before" and date strings
   drift by ±1 day depending on the runner's timezone.
============================================================ */
function toLocalISO(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const d = String(date.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}
function fromLocalISO(str) {
  if (!str) return null;
  const [y, m, d] = str.split('-').map(Number);
  return new Date(y, m - 1, d);
}
function todayLocalISO() {
  return toLocalISO(new Date());
}

/* ============================================================
   PLAN GENERATION
   Simple heuristic plan. Good enough for v1.
============================================================ */
/**
 * Plan generator (v2). Evidence-grounded:
 * - Week 1 always starts at the runner's current weekly volume (no jump on day one)
 * - Volume grows by a volume-dependent rate (15% under 30km/wk, 12% under 50km, 8% under 70km, 5% above)
 *   reflecting research that low-volume runners can safely progress faster
 * - Stepback (cutback) weeks every 3rd week at 80% of last high (Higdon-style)
 * - Long run progresses to ~80% of race distance, capped at 32km
 *   (meta-analysis of 92 sub-elite plans: 32km long runs most predictive of marathon time)
 * - Long run capped at 55% of weekly volume so it never dominates
 * - Peak weekly targets per race+level drawn from Higdon Novice (marathon=64km) and Pfitzinger 18/55, 18/70
 * - 2-3 week taper, race-week shakeouts only
 */

const PEAK_WEEKLY_TARGETS_KM = {
  // Race distance → level → peak weekly volume (km/week)
  5:    { beginner: 25, intermediate: 35, advanced: 55 },
  10:   { beginner: 35, intermediate: 50, advanced: 70 },
  21.1: { beginner: 48, intermediate: 65, advanced: 88 },
  42.2: { beginner: 64, intermediate: 88, advanced: 112 },  // Higdon Novice 1, Pfitz 18/55, Pfitz 18/70
  50:   { beginner: 80, intermediate: 110, advanced: 145 },
};

// Quality session rotation. Each week we pick from this list so over a training cycle
// the runner hits tempo, intervals, hills, and fartlek instead of just one or two.
const QUALITY_ROTATION = ['tempo', 'intervals', 'hill', 'fartlek'];

// Swap pairs — each run type maps to its single allowed swap. Long & race intentionally absent.
const SWAP_MAP = {
  tempo: 'intervals',
  intervals: 'tempo',
  hill: 'fartlek',
  fartlek: 'hill',
  easy: 'recovery',
  recovery: 'easy',
};
const SWAP_LOCK_REASON = {
  long: 'Long runs are too important to swap',
  race: 'Race day cannot be swapped',
};

function composeWeekTypes(numOtherRuns, weekIdx, phase) {
  // Returns an array of run types of length numOtherRuns, structured for the phase
  // and rotating quality sessions across weeks for variety.
  const q1 = QUALITY_ROTATION[weekIdx % QUALITY_ROTATION.length];
  const q2 = QUALITY_ROTATION[(weekIdx + 2) % QUALITY_ROTATION.length];

  if (phase === 'Taper') {
    // Keep one short tempo to maintain leg speed; everything else easy/recovery
    if (numOtherRuns <= 1) return Array(Math.max(0, numOtherRuns)).fill('easy');
    if (numOtherRuns === 2) return ['tempo', 'easy'];
    if (numOtherRuns === 3) return ['easy', 'tempo', 'recovery'];
    if (numOtherRuns === 4) return ['easy', 'tempo', 'easy', 'recovery'];
    return ['recovery', 'tempo', 'easy', 'easy', 'recovery'].slice(0, numOtherRuns);
  }

  // Build / Peak phases
  if (numOtherRuns === 0) return [];
  if (numOtherRuns === 1) return [q1];                                 // 2 runs/wk: long + quality
  if (numOtherRuns === 2) return ['easy', q1];                         // 3 runs/wk
  if (numOtherRuns === 3) return ['easy', q1, 'easy'];                 // 4 runs/wk
  if (numOtherRuns === 4) return ['easy', q1, 'easy', q2];             // 5 runs/wk: 2 quality
  if (numOtherRuns === 5) return ['recovery', q1, 'easy', q2, 'easy']; // 6 runs/wk
  // Fallback for >6 (shouldn't happen — capped at 6 in onboarding)
  return Array.from({length: numOtherRuns}, (_, i) => i === 1 ? q1 : i === 3 ? q2 : 'easy');
}

function safeGrowthRate(currentKm) {
  if (currentKm < 30) return 1.15;
  if (currentKm < 50) return 1.12;
  if (currentKm < 70) return 1.08;
  return 1.05;
}

function computePhases(totalWeeks) {
  const taperWeeks = Math.min(3, Math.max(1, Math.round(totalWeeks * 0.15)));
  const peakHoldWeeks = totalWeeks > 8 ? Math.min(2, Math.max(0, Math.round(totalWeeks * 0.10))) : 0;
  const buildWeeks = Math.max(1, totalWeeks - taperWeeks - peakHoldWeeks);
  const phases = [];
  for (let w = 0; w < totalWeeks; w++) {
    if (w < buildWeeks) phases.push('Build');
    else if (w < buildWeeks + peakHoldWeeks) phases.push('Peak');
    else phases.push('Taper');
  }
  return phases;
}

function computeWeeklyVolumes(p, totalWeeks, phases) {
  const start = Math.max(8, Math.round(p.currentWeeklyKm || 15));
  const peakLookup = PEAK_WEEKLY_TARGETS_KM[p.distanceKm] || PEAK_WEEKLY_TARGETS_KM[42.2];
  const levelPeak = peakLookup[p.level] || peakLookup.intermediate;
  // Target peak is at least 10% above current, but capped at level-appropriate target
  const targetPeak = Math.max(start * 1.10, levelPeak);

  const buildWeeks = phases.filter(x => x === 'Build').length;
  const peakHoldWeeks = phases.filter(x => x === 'Peak').length;

  const volumes = [];
  let lastHigh = start;
  for (let w = 0; w < totalWeeks; w++) {
    const phase = phases[w];
    let weekKm;
    if (phase === 'Build') {
      const isCutback = (w + 1) % 3 === 0 && w >= 2; // stepback every 3rd week, not week 1
      if (w === 0) {
        weekKm = start;
        lastHigh = start;
      } else if (isCutback) {
        weekKm = lastHigh * 0.80;
      } else {
        weekKm = Math.min(lastHigh * safeGrowthRate(lastHigh), targetPeak);
        lastHigh = weekKm;
      }
    } else if (phase === 'Peak') {
      weekKm = lastHigh;
    } else {
      const t = w - buildWeeks - peakHoldWeeks;
      const taperReductions = [0.75, 0.55, 0.40];
      weekKm = lastHigh * (taperReductions[t] || 0.30);
    }
    volumes.push(Math.round(Math.max(5, weekKm)));
  }
  return volumes;
}

function computeLongRuns(p, totalWeeks, phases, weeklyVolumes) {
  // Long run peaks at 80% of race distance, capped at 32km (research-backed marathon ceiling)
  const longRunPeakTarget = Math.min(p.distanceKm * 0.80, 32);
  // Starting long run = ~33% of current weekly volume, minimum 5km
  const longStart = Math.max(5, Math.round((p.currentWeeklyKm || 15) * 0.33));

  const buildWeeks = phases.filter(x => x === 'Build').length;
  const peakHoldWeeks = phases.filter(x => x === 'Peak').length;

  const longs = [];
  let lastHigh = longStart;
  for (let w = 0; w < totalWeeks; w++) {
    const phase = phases[w];
    let longKm;
    if (phase === 'Build') {
      const isCutback = (w + 1) % 3 === 0 && w >= 2;
      if (w === 0) {
        longKm = longStart;
        lastHigh = longStart;
      } else if (isCutback) {
        longKm = lastHigh * 0.75;
      } else {
        const rate = lastHigh < 16 ? 1.15 : 1.10; // shorter long runs can grow a bit faster
        longKm = Math.min(lastHigh * rate, longRunPeakTarget);
        // Don't let long run exceed 55% of weekly volume — keeps the week balanced
        longKm = Math.min(longKm, weeklyVolumes[w] * 0.55);
        lastHigh = longKm;
      }
    } else if (phase === 'Peak') {
      longKm = Math.min(lastHigh, longRunPeakTarget);
    } else {
      const t = w - buildWeeks - peakHoldWeeks;
      const taperReductions = [0.65, 0.45, 0.30];
      longKm = lastHigh * (taperReductions[t] || 0.25);
    }
    longs.push(Math.round(Math.max(3, longKm)));
  }
  return longs;
}

function buildPlan(p) {
  const today = new Date(); today.setHours(0,0,0,0);
  const race = fromLocalISO(p.raceDate);
  const start = new Date(today);
  const day = start.getDay();
  const mondayOffset = (day === 0 ? -6 : 1 - day);
  start.setDate(start.getDate() + mondayOffset);

  const totalDays = Math.ceil((race - start) / (24*60*60*1000));
  const totalWeeks = Math.max(2, Math.ceil(totalDays / 7));

  const phases = computePhases(totalWeeks);
  const weeklyVolumes = computeWeeklyVolumes(p, totalWeeks, phases);
  const longRunDistances = computeLongRuns(p, totalWeeks, phases, weeklyVolumes);

  const weeks = [];
  let runId = 0;
  for (let w = 0; w < totalWeeks; w++) {
    const weekStart = new Date(start);
    weekStart.setDate(weekStart.getDate() + w * 7);
    const weekEnd = new Date(weekStart);
    weekEnd.setDate(weekEnd.getDate() + 6);
    const isRaceWeek = race >= weekStart && race <= weekEnd;

    const runs = distributeWeek({
      weekKm: weeklyVolumes[w],
      longKm: longRunDistances[w],
      profile: p,
      phase: phases[w],
      weekStart,
      isRaceWeek,
      raceDate: race,
      weekIndex: w,
      totalWeeks
    }).map(r => ({ ...r, id: `r${runId++}` }));

    weeks.push({
      weekNumber: w + 1,
      phase: isRaceWeek ? 'Race week' : phases[w],
      startDate: toLocalISO(weekStart),
      plannedKm: runs.reduce((s, r) => s + (r.km || 0), 0),
      runs
    });
  }

  return { startDate: toLocalISO(start), weeks };
}

function distributeWeek({ weekKm, longKm, profile, phase, weekStart, isRaceWeek, raceDate, weekIndex, totalWeeks }) {
  // Build list of run days. Prefer long run day.
  const dayNames = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
  const longIdx = dayNames.indexOf(profile.longRunDay || 'Sunday');
  const freq = profile.runsPerWeek;

  // Preferred day slots by frequency
  const slotsByFreq = {
    3: [1, 3, longIdx],                              // Tue / Thu / Long
    4: [1, 2, 4, longIdx],                           // Tue / Wed / Fri / Long
    5: [0, 1, 3, 4, longIdx],                        // Mon / Tue / Thu / Fri / Long
    6: [0, 1, 2, 3, 4, longIdx],                     // Mon–Fri + Long
  };
  let slots = [...new Set(slotsByFreq[freq])];
  // In case longIdx overlapped, top up
  for (let d = 0; d < 7 && slots.length < freq; d++) {
    if (!slots.includes(d)) slots.push(d);
  }
  slots = slots.slice(0, freq).sort((a,b) => a-b);

  // Long run distance is now provided by the planner. Cap as a safety net at 55% of weekly volume.
  const safeLongKm = Math.max(3, Math.min(longKm, weekKm * 0.55));
  const remaining = Math.max(0, weekKm - safeLongKm);
  const otherRuns = slots.filter(s => s !== longIdx);

  // Compose the week's non-long run types. Quality sessions rotate across weeks so the
  // runner hits every workout type (tempo, intervals, hills, fartlek) over a training cycle.
  const types = composeWeekTypes(otherRuns.length, weekIndex, phase);

  // Length bias: easy runs absorb most volume; quality sessions are tighter; recovery is shortest.
  const lengthBias = (t) => {
    if (t === 'recovery') return 0.6;
    if (['tempo','intervals','hill','fartlek'].includes(t)) return 0.85;
    return 1.0; // easy
  };
  const weights = types.map(lengthBias);
  const wsum = weights.reduce((a,b) => a+b, 0) || 1;
  const perRun = types.map((_, i) => Math.max(3, Math.round(remaining * weights[i] / wsum)));

  const runs = [];
  let typeIdx = 0;
  for (const dayIdx of slots) {
    const date = new Date(weekStart);
    date.setDate(date.getDate() + dayIdx);
    if (dayIdx === longIdx) {
      runs.push(makeRun('long', date, safeLongKm, phase));
    } else {
      const type = types[typeIdx];
      const km = perRun[typeIdx] || Math.max(3, Math.round(remaining / Math.max(1, otherRuns.length)));
      runs.push(makeRun(type, date, km, phase));
      typeIdx++;
    }
  }

  // Race week override
  if (isRaceWeek) {
    // Only keep 2-3 short shakeouts, plus race day
    const kept = runs.filter(r => r.date !== toLocalISO(raceDate))
                     .slice(0, Math.min(3, runs.length - 1))
                     .map(r => ({ ...r, type: 'recovery', title: 'Shakeout', km: Math.min(r.km, 5), durationMin: Math.round(Math.min(r.km,5) * 6.5), notes: 'Very easy. Stay loose.' }));
    kept.push(makeRun('race', raceDate, profile.distanceKm, 'Race'));
    return kept;
  }

  return runs;
}

function makeRun(type, date, km, phase) {
  const pacesMinPerKm = {
    easy: 6.5, recovery: 7.0, long: 6.3, tempo: 5.2,
    intervals: 4.8, fartlek: 5.8, hill: 5.5, race: 5.5
  };
  const pace = pacesMinPerKm[type] || 6;
  const durationMin = Math.round(km * pace);
  const titles = {
    easy: 'Easy run',
    recovery: 'Recovery jog',
    long: 'Long run',
    tempo: `Tempo (${Math.max(1, Math.round(km*0.5))}K at threshold)`,
    intervals: `Intervals (e.g. ${Math.max(4, Math.round(km/1.5))} × 400m)`,
    fartlek: 'Fartlek — play with pace',
    hill: `Hill sprints (${Math.max(4, Math.round(km*0.6))} × 30s)`,
    race: 'Race day 🏁'
  };
  return {
    date: toLocalISO(date),
    type,
    title: titles[type] || 'Run',
    km,
    durationMin,
    notes: RUN_TYPES[type].summary,
    completed: false,
    actualKm: null,
    actualMin: null,
  };
}

function showApp() {
  showOnly('app');
  // Pick the week containing today if possible
  const todayStr = todayLocalISO();
  const idx = state.plan.weeks.findIndex(w => {
    const start = fromLocalISO(w.startDate);
    const end = new Date(start); end.setDate(end.getDate() + 6);
    const today = fromLocalISO(todayStr);
    return today >= start && today <= end;
  });
  state.currentWeek = idx >= 0 ? idx : 0;
  save();
  renderAll();
}

function renderAll() {
  renderRaceSummary();
  renderLegend();
  renderMetricsTop();
  renderCalendar();
  renderMetricsDetail();
  renderFullPlan();
  renderView();
}

function renderRaceSummary() {
  const p = state.profile;
  const el = document.getElementById('race-summary');
  if (!p) { el.innerHTML = ''; return; }
  const race = fromLocalISO(p.raceDate);
  const today = new Date(); today.setHours(0,0,0,0);
  const daysTo = Math.ceil((race - today) / (24*60*60*1000));
  el.innerHTML = `
    <div style="font-weight:700; color:var(--text); font-size:16px; margin-bottom:6px; letter-spacing:-0.02em;">${p.raceName || 'Your race'}</div>

      <span style="font-size: 22px; font-weight: 700; color:var(--accent); letter-spacing:-0.03em; line-height:1;">${daysTo}</span>
      <span style="font-size: 12px; color: var(--text-2); font-weight: 500;">days to go</span>

function renderLegend() {
  const el = document.getElementById('legend');
  el.innerHTML = Object.entries(RUN_TYPES).map(([k,v]) =>
    `<div class="legend-item">
      <div class="legend-swatch" style="background:${v.color};"></div>${v.label}
    </div>`
  ).join('');
}

function renderMetricsTop() {
  const m = computeMetrics();
  const el = document.getElementById('metrics-top');
  el.innerHTML = [
    { label: 'Plan complete', value: `${m.pctTimeElapsed.toFixed(0)}%`, sub: `Week ${m.currentWeekNum} of ${m.totalWeeks}`, pct: m.pctTimeElapsed },
    { label: 'Runs completed', value: `${m.completedRuns}/${m.totalRuns}`, sub: `${m.pctRunsCompleted.toFixed(0)}% of planned runs`, pct: m.pctRunsCompleted },
    { label: 'Distance logged', value: `${m.actualKm.toFixed(1)} km`, sub: `of ${m.plannedKm.toFixed(0)} km planned`, pct: m.plannedKm ? (m.actualKm/m.plannedKm*100) : 0 },
    { label: 'Avg pace', value: m.avgPace ? `${m.avgPace}` : '—', sub: m.avgPace ? 'across completed runs' : 'log a run to see this' },
  ].map(c => `
    <div class="metric">
      <div class="label">${c.label}</div>
      <div class="value">${c.value}</div>
      <div class="sub">${c.sub}</div>
      ${c.pct !== undefined ? `<div class="progress"><div style="width:${Math.min(100,c.pct)}%"></div></div>` : ''}
    </div>
  `).join('');
}

function renderMetricsDetail() {
  const m = computeMetrics();
  const byType = m.byType;
  const weeks = state.plan.weeks;
  const maxWeek = Math.max(...weeks.map(w => w.plannedKm), 1);
  const el = document.getElementById('metrics-detail');
  el.innerHTML = `
    <div class="grid" style="grid-template-columns: 1fr 1fr; gap:16px;">
      <div>
        <h3 style="margin:0 0 10px; font-size:14px;">Weekly volume</h3>
        <div class="bar-chart">
          ${weeks.map((w, i) => {
            const actual = w.runs.reduce((s,r) => s + (r.actualKm || 0), 0);
            const planned = w.plannedKm;
            return `
              <div class="bar-row">
                <div>W${w.weekNumber} · ${w.phase}</div>
                <div class="bar-track"><div class="bar-fill" style="width:${(planned/maxWeek)*100}%"></div></div>
                <div style="text-align:right; color:${actual>=planned*0.9?'var(--green)':'var(--muted)'};">${actual.toFixed(0)}/${planned.toFixed(0)}km</div>
              </div>
            `;
          }).join('')}
        </div>
      </div>
      <div>
        <h3 style="margin:0 0 10px; font-size:14px;">Runs by type</h3>
        <div class="bar-chart">
          ${Object.entries(byType).map(([k,v]) => `
            <div class="bar-row">
              <div><span class="legend-swatch" style="display:inline-block;background:${RUN_TYPES[k].color}; margin-right:6px;"></span>${RUN_TYPES[k].label}</div>
              <div class="bar-track"><div class="bar-fill" style="width:${(v.completed/Math.max(v.total,1))*100}%"></div></div>
              <div style="text-align:right;">${v.completed}/${v.total}</div>
            </div>
          `).join('')}
        </div>

        <h3 style="margin:18px 0 10px; font-size:14px;">Totals</h3>
        <div class="muted">Total planned distance: <strong style="color:var(--text)">${m.plannedKm.toFixed(0)} km</strong></div>
        <div class="muted">Total distance logged: <strong style="color:var(--text)">${m.actualKm.toFixed(1)} km</strong></div>
        <div class="muted">Total time logged: <strong style="color:var(--text)">${formatMinutes(m.actualMin)}</strong></div>
        <div class="muted">Longest run so far: <strong style="color:var(--text)">${m.longestRun.toFixed(1)} km</strong></div>
      </div>
    </div>
  `;
}

function renderFullPlan() {
  const el = document.getElementById('plan-full');
  el.innerHTML = state.plan.weeks.map(w => `
    <div style="margin-bottom:18px;">
      <div class="flex-between" style="margin-bottom:8px;">
        <div><strong>Week ${w.weekNumber}</strong> — ${w.phase} <span class="muted">(starts ${formatDate(fromLocalISO(w.startDate))})</span></div>
        <div class="muted">${w.plannedKm.toFixed(0)} km planned</div>
      </div>
      <div style="display:grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap:8px;">
        ${w.runs.map(r => renderRunCard(r, false)).join('')}
      </div>
    </div>
  `).join('');
}

function renderCalendar() {
  const w = state.plan.weeks[state.currentWeek];
  document.getElementById('week-label').textContent =
    `Week ${w.weekNumber} · ${w.phase} · ${formatDate(fromLocalISO(w.startDate))}`;

  const grid = document.getElementById('week-grid');
  // Day name is derived from the date itself, not a hardcoded array. This way headers
  // and dates can never disagree even if startDate isn't a Monday for any reason.
  const dayShort = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const todayStr = todayLocalISO();

  grid.innerHTML = Array.from({length: 7}, (_, i) => {
    const date = fromLocalISO(w.startDate);
    date.setDate(date.getDate() + i);
    const dateStr = toLocalISO(date);
    const name = dayShort[date.getDay()];
    const runs = w.runs.filter(r => r.date === dateStr);
    const isToday = dateStr === todayStr;
    return `
      <div class="day ${isToday?'today':''}" data-date="${dateStr}">
        <div class="day-head">
          <div>
            <div class="day-name">${name}</div>
            <div class="day-date">${date.getDate()}</div>
          </div>
          ${isToday?'<span class="badge" style="background:rgba(255,90,31,.15); color:var(--accent);">Today</span>':''}
        </div>
        <div class="day-runs" data-date="${dateStr}">
          ${runs.map(r => renderRunCard(r, true)).join('')}
        </div>
      </div>
    `;
  }).join('');

  attachDnD();
  attachRunClicks();
}

function renderRunCard(r, draggable) {
  const t = RUN_TYPES[r.type];
  return `
    <div class="run-card ${t.cls} ${r.completed?'completed':''}"
         draggable="${draggable}" data-id="${r.id}">
      <button class="check ${r.completed?'checked':''}" data-id="${r.id}" title="Mark complete"></button>
      <div class="run-title">${t.label}</div>
      <div class="run-meta">${r.km.toFixed(1)} km · ~${r.durationMin} min</div>
      ${r.completed && r.actualKm!=null ? `
        <div class="run-meta" style="color:var(--green); margin-top:4px;">
          Logged: ${r.actualKm.toFixed(1)} km · ${r.actualMin} min
        </div>` : ''}
    </div>
  `;
}

function attachRunClicks() {
  document.querySelectorAll('.run-card').forEach(card => {
    card.addEventListener('click', e => {
      if (e.target.classList.contains('check')) return;
      openRunModal(card.dataset.id);
    });
  });
  document.querySelectorAll('.check').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const run = findRun(btn.dataset.id);
      if (!run) return;
      run.completed = !run.completed;
      if (run.completed && run.actualKm == null) {
        run.actualKm = run.km;
        run.actualMin = run.durationMin;
      }
      save();
      renderMetricsTop();
      renderCalendar();
      renderMetricsDetail();
    });
  });
}

/* ============================================================
   DRAG & DROP
============================================================ */
function attachDnD() {
  let draggingId = null;
  document.querySelectorAll('.run-card[draggable="true"]').forEach(card => {
    card.addEventListener('dragstart', e => {
      draggingId = card.dataset.id;
      card.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', card.dataset.id);
    });
    card.addEventListener('dragend', () => {
      card.classList.remove('dragging');
    });
  });
  document.querySelectorAll('.day').forEach(day => {
    day.addEventListener('dragover', e => {
      e.preventDefault();
      day.classList.add('drag-over');
    });
    day.addEventListener('dragleave', () => day.classList.remove('drag-over'));
    day.addEventListener('drop', e => {
      e.preventDefault();
      day.classList.remove('drag-over');
      const id = e.dataTransfer.getData('text/plain');
      const newDate = day.dataset.date;
      const run = findRun(id);
      if (!run || run.date === newDate) return;
      run.date = newDate;
      save();
      renderCalendar();
      renderMetricsTop();
      renderFullPlan();
    });
  });
}

/* ============================================================
   RUN MODAL (log distance + time)
============================================================ */
function swapRunType(run, targetType) {
  // Regenerate type-derived fields (title, duration estimate, summary notes) but
  // preserve user state: id, completed, actualKm, actualMin, userNotes.
  const date = fromLocalISO(run.date);
  const fresh = makeRun(targetType, date, run.km, '');
  run.type = targetType;
  run.title = fresh.title;
  run.durationMin = fresh.durationMin;
  run.notes = fresh.notes;
  save();
  renderCalendar();
  renderMetricsTop();
  renderMetricsDetail();
  renderFullPlan();
}

function openRunModal(id) {
  const run = findRun(id);
  if (!run) return;
  const t = RUN_TYPES[run.type];
  document.getElementById('modal-title').textContent = `${t.label} — ${formatDate(fromLocalISO(run.date))}`;
  document.getElementById('modal-sub').textContent = t.summary;
  document.getElementById('modal-body').innerHTML = `
    <div style="background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-bottom: 14px;">
      <div style="margin-bottom: 10px;">
        <div style="font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: ${t.color}; font-weight: 700; margin-bottom: 4px;">How to run it</div>
        <div style="font-size: 13px; line-height: 1.5;">${t.howTo}</div>
      </div>
      <div>
        <div style="font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: ${t.color}; font-weight: 700; margin-bottom: 4px;">Why you do it</div>
        <div style="font-size: 13px; line-height: 1.5;">${t.why}</div>
      </div>
    </div>
    <div class="row">
      <div>
        <label>Planned distance</label>
        <input disabled value="${run.km.toFixed(1)} km" />
      </div>
      <div>
        <label>Planned duration</label>
        <input disabled value="${run.durationMin} min" />
      </div>
    </div>
    <div style="height:12px;"></div>
    <div class="row">
      <div>
        <label>Actual distance (km)</label>
        <input id="m-km" type="number" step="0.1" min="0" value="${run.actualKm ?? run.km}" />
      </div>
      <div>
        <label>Actual time (min)</label>
        <input id="m-min" type="number" step="1" min="0" value="${run.actualMin ?? run.durationMin}" />
      </div>
    </div>
    <div style="height:12px;"></div>
    <label>Notes</label>
    <textarea id="m-notes" rows="2">${run.userNotes || ''}</textarea>
    <div style="height:12px;"></div>
    <label style="display:flex; align-items:center; gap:8px; cursor:pointer;">
      <input type="checkbox" id="m-done" ${run.completed?'checked':''} style="width:auto;" />
      Mark as completed
    </label>
  `;
  // Swap button: shows the allowed alternate type, or locked reason for long/race
  const swapBtn = document.getElementById('modal-swap');
  const swapTarget = SWAP_MAP[run.type];
  if (swapTarget) {
    swapBtn.disabled = false;
    swapBtn.textContent = `Swap to ${RUN_TYPES[swapTarget].label}`;
    swapBtn.title = `Change this run to a ${RUN_TYPES[swapTarget].label.toLowerCase()} session`;
    swapBtn.onclick = () => {
      swapRunType(run, swapTarget);
      openRunModal(id); // re-render with new type
    };
  } else {
    swapBtn.disabled = true;
    swapBtn.textContent = SWAP_LOCK_REASON[run.type] || 'Cannot swap';
    swapBtn.title = '';
    swapBtn.onclick = null;
  }

  const backdrop = document.getElementById('modal-backdrop');
  backdrop.classList.remove('hidden');
  document.getElementById('modal-cancel').onclick = () => backdrop.classList.add('hidden');
  document.getElementById('modal-save').onclick = () => {
    run.actualKm = parseFloat(document.getElementById('m-km').value) || 0;
    run.actualMin = parseFloat(document.getElementById('m-min').value) || 0;
    run.userNotes = document.getElementById('m-notes').value;
    run.completed = document.getElementById('m-done').checked;
    save();
    backdrop.classList.add('hidden');
    renderCalendar();
    renderMetricsTop();
    renderMetricsDetail();
    renderFullPlan();
  };
}

/* ============================================================
   METRICS
============================================================ */
function computeMetrics() {
  const weeks = state.plan.weeks;
  const allRuns = weeks.flatMap(w => w.runs);
  const completed = allRuns.filter(r => r.completed);
  const plannedKm = allRuns.reduce((s,r) => s + (r.km||0), 0);
  const actualKm = allRuns.reduce((s,r) => s + (r.actualKm||0), 0);
  const actualMin = allRuns.reduce((s,r) => s + (r.actualMin||0), 0);

  const byType = {};
  for (const k of Object.keys(RUN_TYPES)) byType[k] = { total: 0, completed: 0 };
  for (const r of allRuns) {
    if (!byType[r.type]) byType[r.type] = { total: 0, completed: 0 };
    byType[r.type].total++;
    if (r.completed) byType[r.type].completed++;
  }

  const today = new Date(); today.setHours(0,0,0,0);
  const start = fromLocalISO(state.plan.startDate);
  const race = fromLocalISO(state.profile.raceDate);
  const total = Math.max(1, race - start);
  const elapsed = Math.max(0, Math.min(total, today - start));
  const pctTimeElapsed = (elapsed / total) * 100;

  const avgPaceMin = completed.length ?
    (completed.reduce((s,r) => s + (r.actualMin/Math.max(r.actualKm,0.01)), 0) / completed.length) : null;
  const avgPace = avgPaceMin ? `${Math.floor(avgPaceMin)}:${String(Math.round((avgPaceMin%1)*60)).padStart(2,'0')}/km` : null;

  const longestRun = Math.max(0, ...completed.map(r => r.actualKm || 0));

  return {
    totalRuns: allRuns.length,
    completedRuns: completed.length,
    pctRunsCompleted: allRuns.length ? (completed.length/allRuns.length*100) : 0,
    plannedKm,
    actualKm,
    actualMin,
    pctTimeElapsed,
    avgPace,
    longestRun,
    currentWeekNum: state.currentWeek + 1,
    totalWeeks: weeks.length,
    byType,
  };
}

/* ============================================================
   UTILS
============================================================ */
function findRun(id) {
  for (const w of state.plan.weeks) {
    for (const r of w.runs) if (r.id === id) return r;
  }
  return null;
}
function formatDate(d) {
  return d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
}
function formatMinutes(m) {
  if (!m) return '0 min';
  const h = Math.floor(m/60), mm = Math.round(m%60);
  return h ? `${h}h ${mm}m` : `${mm} min`;
}

/* ============================================================
   VIEW SWITCHING / WEEK NAV
============================================================ */
function renderView() {
  document.querySelectorAll('.view').forEach(v => v.classList.add('hidden'));
  document.getElementById('view-'+state.view).classList.remove('hidden');
  document.querySelectorAll('.nav-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.view === state.view);
  });
}
document.querySelectorAll('.nav-btn').forEach(b => {
  b.addEventListener('click', () => {
    state.view = b.dataset.view;
    save();
    renderView();
  });
});
document.getElementById('prev-week').addEventListener('click', () => {
  if (state.currentWeek > 0) { state.currentWeek--; save(); renderCalendar(); }
});
document.getElementById('next-week').addEventListener('click', () => {
  if (state.currentWeek < state.plan.weeks.length - 1) { state.currentWeek++; save(); renderCalendar(); }
});
document.getElementById('this-week').addEventListener('click', () => {
  const todayStr = todayLocalISO();
  const idx = state.plan.weeks.findIndex(w => {
    const s = fromLocalISO(w.startDate);
    const e = new Date(s); e.setDate(e.getDate()+6);
    const t = fromLocalISO(todayStr);
    return t >= s && t <= e;
  });
  if (idx >= 0) { state.currentWeek = idx; save(); renderCalendar(); }
});

// Reset handler is wired up inside boot() — see below — because it needs the signed-in user.

/* ============================================================
   AUTH UI
============================================================ */
let authMode = 'signin';

const EYE_SVG = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYE_OFF_SVG = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';

document.querySelectorAll('.password-toggle').forEach(btn => {
  btn.innerHTML = EYE_SVG; // initial icon
  btn.addEventListener('click', () => {
    const input = document.getElementById(btn.dataset.target);
    const willShow = input.type === 'password';
    input.type = willShow ? 'text' : 'password';
    btn.innerHTML = willShow ? EYE_OFF_SVG : EYE_SVG;
    btn.setAttribute('aria-label', willShow ? 'Hide password' : 'Show password');
  });
});

function setAuthMode(mode) {
  authMode = mode;
  document.querySelectorAll('.auth-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.mode === mode);
  });
  document.getElementById('auth-title').textContent =
    mode === 'signin' ? 'Welcome back' : 'Create your account';
  document.getElementById('auth-sub').textContent =
    mode === 'signin'
      ? 'Sign in to access your training plan.'
      : 'Sign up to save your plan and access it from any device.';
  document.getElementById('auth-submit').textContent =
    mode === 'signin' ? 'Sign in' : 'Create account';
  document.getElementById('auth-error').textContent = '';
  document.getElementById('auth-info').textContent = '';
  document.getElementById('auth-password-confirm-row').classList.toggle('hidden', mode !== 'signup');
  document.getElementById('auth-password-confirm').value = '';
}
document.querySelectorAll('.auth-tab').forEach(tab => {
  tab.addEventListener('click', () => setAuthMode(tab.dataset.mode));
});

document.getElementById('auth-submit').addEventListener('click', async () => {
  const email = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-password').value;
  const errorEl = document.getElementById('auth-error');
  const infoEl = document.getElementById('auth-info');
  errorEl.textContent = ''; infoEl.textContent = '';

  if (!email || !password) { errorEl.textContent = 'Email and password are required.'; return; }
  if (password.length < 6)  { errorEl.textContent = 'Password must be at least 6 characters.'; return; }
  if (authMode === 'signup') {
    const confirm = document.getElementById('auth-password-confirm').value;
    if (confirm !== password) { errorEl.textContent = 'Passwords do not match.'; return; }
  }

  const btn = document.getElementById('auth-submit');
  btn.disabled = true;
  const originalLabel = btn.textContent;
  btn.textContent = '…';

  try {
    if (authMode === 'signin') {
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) errorEl.textContent = error.message;
      // success handled by onAuthStateChange
    } else {
      const { data, error } = await sb.auth.signUp({
        email,
        password,
        options: { emailRedirectTo: window.location.origin + window.location.pathname }
      });
      if (error) errorEl.textContent = error.message;
      else if (!data.session) {
        // Email confirmation is on — show check-inbox message
        infoEl.textContent = 'Account created. Check your email to verify, then sign in.';
        setAuthMode('signin');
      }
      // If session is returned (confirmation off), onAuthStateChange handles it
    }
  } finally {
    btn.disabled = false;
    btn.textContent = originalLabel;
  }
});

['auth-email','auth-password','auth-password-confirm'].forEach(id => {
  document.getElementById(id).addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('auth-submit').click();
  });
});

document.getElementById('auth-forgot').addEventListener('click', async (e) => {
  e.preventDefault();
  const email = document.getElementById('auth-email').value.trim();
  const errorEl = document.getElementById('auth-error');
  const infoEl = document.getElementById('auth-info');
  errorEl.textContent = ''; infoEl.textContent = '';
  if (!email) { errorEl.textContent = 'Enter your email above first.'; return; }
  const { error } = await sb.auth.resetPasswordForEmail(email, {
    redirectTo: window.location.origin + window.location.pathname
  });
  if (error) errorEl.textContent = error.message;
  else infoEl.textContent = 'Password reset email sent.';
});

document.getElementById('btn-logout').addEventListener('click', async () => {
  await sb.auth.signOut();
});

/* ============================================================
   SCREEN ROUTING
============================================================ */
function showOnly(id) {
  ['boot-loader','auth','onboarding','app'].forEach(s => {
    document.getElementById(s).classList.toggle('hidden', s !== id);
  });
}
function setSignedInChrome(signedIn, email) {
  document.getElementById('user-email').textContent = email || '';
  document.getElementById('user-email').classList.toggle('hidden', !signedIn);
  document.getElementById('btn-logout').classList.toggle('hidden', !signedIn);
  document.getElementById('btn-reset').classList.toggle('hidden', !signedIn);
}

async function onSignedIn(user) {
  currentUser = user;
  setSignedInChrome(true, user.email);

  const row = await loadFromSupabase();
  if (row && row.plan && row.profile) {
    state.profile = row.profile;
    state.plan = row.plan;
    state.currentWeek = row.current_week ?? 0;
    state.view = row.view ?? 'calendar';
    showApp();
    return;
  }

  // No cloud plan yet — offer to import a legacy localStorage plan if one exists
  const legacy = loadLegacyLocal();
  if (legacy && legacy.plan && legacy.profile) {
    const yes = confirm('We found a training plan saved on this device from before you had an account. Import it to your account?');
    if (yes) {
      state.profile = legacy.profile;
      state.plan = legacy.plan;
      state.currentWeek = legacy.currentWeek ?? 0;
      state.view = legacy.view ?? 'calendar';
      await saveNow();
      localStorage.removeItem(LEGACY_LOCAL_KEY);
      showApp();
      return;
    } else {
      localStorage.removeItem(LEGACY_LOCAL_KEY);
    }
  }

  // Brand new user — onboarding
  state.profile = null;
  state.plan = null;
  state.onboarding = { step: 0 };
  showOnly('onboarding');
  renderOnboarding();
}

function onSignedOut() {
  currentUser = null;
  state.profile = null;
  state.plan = null;
  state.onboarding = { step: 0 };
  setSignedInChrome(false);
  // Clear inputs
  document.getElementById('auth-email').value = '';
  document.getElementById('auth-password').value = '';
  document.getElementById('auth-password-confirm').value = '';
  document.getElementById('auth-error').textContent = '';
  document.getElementById('auth-info').textContent = '';
  setAuthMode('signin');
  showOnly('auth');
}

/* ============================================================
   BOOT
============================================================ */
(async function boot() {
  showOnly('boot-loader');

  // Reset is per-user: clear cloud plan and re-onboard
  document.getElementById('btn-reset').onclick = async () => {
    if (!confirm('Clear your plan and start onboarding again? This deletes your cloud-saved plan.')) return;
    if (currentUser) {
      await sb.from('training_plans').delete().eq('user_id', currentUser.id);
    }
    state.profile = null;
    state.plan = null;
    state.onboarding = { step: 0 };
    showOnly('onboarding');
    renderOnboarding();
  };

  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    await onSignedIn(session.user);
  } else {
    onSignedOut();
  }

  sb.auth.onAuthStateChange((event, session) => {
    if (event === 'SIGNED_IN' && session && (!currentUser || currentUser.id !== session.user.id)) {
      onSignedIn(session.user);
    } else if (event === 'SIGNED_OUT') {
      onSignedOut();
    }
  });
})();
</script>
